{% extends "base.html" %}
{% block content %}

<h2>Cargos</h2>

<div class="actions-bar">
    <a class="btn" href="/roles/new">Novo Cargo</a>
</div>

{% if roles and roles|length %}
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Criado em</th>
            </tr>
        </thead>
        <tbody>
            {% for role in roles %}
            <tr>
                <td>{{ role.id }}</td>
                <td>{{ role.title }}</td>
                <td>{{ role.created_at | brl_date }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p class="empty-state">Nenhum cargo cadastrado.</p>
{% endif %}

{% endblock %}
